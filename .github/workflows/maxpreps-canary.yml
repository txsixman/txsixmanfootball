# Reads one seed team's MaxPreps schedule page before the game nights and fails if MaxPreps changed the page's shape,
# so a broken reader shows up as a failed run (and GitHub's email to the repo's owner) on Wednesday or Thursday, not on
# a playoff night. One request, the reader's own user agent and robots.txt path rule (ADR 0008). No secrets, no writes.
name: MaxPreps canary

on:
  schedule:
    - cron: "7 15 * 8-12,1 3,4" # Wednesdays and Thursdays, 9:07 AM Central (10:07 in daylight time), August to January
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    if: github.event_name != 'schedule' || vars.LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: One schedule page, read and checked
        run: node tools/league-watch/maxpreps.mjs --canary
