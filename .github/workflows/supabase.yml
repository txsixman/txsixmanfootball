# Loads the hosted database (Supabase) from main: new migrations, then every alignment and game file, then the live
# security checks (row-level security everywhere; the API roles hold no table, column or sequence right and no policy exists,
# and may run only the push sign-up pair and the signed-in functions, among them record_admin_audit(), migration 0010:
# load.mjs checkLive tests the rights each role effectively holds, PUBLIC included, and fails on anything wider). Called by main.yml after a push to
# main and by Results watch after it commits new scores; also runs by hand. Safe to re-run.
# Also weekly: a free Supabase project pauses after 7 days without activity, and the off-season (Feb to Jul) can pass
# weeks without a push or a results run. The weekly load keeps it awake and re-runs the live security checks.
# Needs the repo secrets SUPABASE_DB_PASSWORD and DATA_PRIVATE_TOKEN (never from a pull-request run: CI's data job
# checks). Without the password the job says so in the run summary and does nothing.
name: Supabase

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1" # Mondays, 5:17 AM Central (6:17 in daylight time)

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One load at a time; a newer one waits rather than cancelling a load half done.
    concurrency:
      group: supabase
      cancel-in-progress: false
    env:
      # Project vhgnaihnyjdnaaergtcl (the owner's personal org, us-east-1), through the IPv4 session pooler. Not secrets.
      PGHOST: aws-0-us-east-1.pooler.supabase.com
      PGUSER: postgres.vhgnaihnyjdnaaergtcl
      PGSSLROOTCERT: packages/db/supabase-ca.crt
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the newest main, including a commit the caller just pushed
      - name: Skip, loudly, without the password or before the repo is live
        id: gate
        env:
          LIVE: ${{ vars.LIVE }} # repo variable, set at cut-over; until then nothing is written
          # A run of this workflow by hand (not one called by another) loads before LIVE too: the proof. The load is
          # idempotent (unchanged games are skipped), so it is safe while the old repo still loads the same files.
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Supabase' }}
        run: |
          if [ "$LIVE" != true ] && [ "$BY_HAND" != true ]; then
            echo "Supabase not loaded: the repo variable LIVE is not true yet." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PGPASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD is not set; Supabase was not loaded."
            echo "Supabase not loaded: the SUPABASE_DB_PASSWORD secret is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: The private data (robot-read games with their source pages; this repo holds the facts only)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: txsixman/data-private
          token: ${{ secrets.DATA_PRIVATE_TOKEN }}
          path: private
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        run: npm ci --prefix packages/db
      - name: Load and check
        if: steps.gate.outputs.run == 'true'
        env:
          PRIVATE_DATA: ${{ github.workspace }}/private
        run: |
          node packages/db/load.mjs > "$RUNNER_TEMP/load.json"
          # The ${...} below are JavaScript template literals, for node, not the shell.
          # shellcheck disable=SC2016
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const games = r.games.map((g) => `${g.file}: ${g.inserted} new, ${g.updated} updated, ${g.unchanged} unchanged, ${g.flags} flagged`);
            console.log(["Supabase loaded.", `Migrations applied: ${r.migrations.join(", ") || "none new"}`, ...games,
              `Live checks: ${r.problems.length ? r.problems.join("; ") : "pass"}`].map((l) => `- ${l}`).join("\n"));
          ' "$RUNNER_TEMP/load.json" >> "$GITHUB_STEP_SUMMARY"
