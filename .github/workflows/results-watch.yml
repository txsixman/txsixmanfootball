# Reads six-man game results from MaxPreps team schedule pages (ADR 0008; playoff game days, ADRs 0015 and 0019), rerates the
# season, and commits straight to main, so Vercel deploys new scores and ratings with no one at a keyboard. The full
# captures (each game's source page, coverage, outside games) live in the private repo txsixman/data-private; this repo
# gets the facts the site shows (tools/league-watch/publish.mjs). The private repo is committed first, then this one,
# and every run republishes from the private files, so a run whose public push failed is repaired by the next. A commit
# made with the workflow's token does not start CI, so this job runs the same checks first. A failed read fails the job,
# and the notify job posts it to the robot-alert issue, which emails the owner (ADR 0027): a run the game-day clock
# started is the github-actions bot's, and GitHub emails no one about those.
# A night read also sends the scores of games still under way to the hosted database (live_score, ADR 0021): no commit and
# no rebuild, the site reads them in the browser. Only finals are committed.
# Before cut-over (repo variable LIVE not true) the schedules do nothing, a dispatch reads and checks but pushes only
# with the input `write`, and alerts and the hosted database are never touched.
#
# Three kinds of read, told apart by the `mode` the `due` job works out (the run's title, below, says it too):
#   morning   Friday to Sunday mornings (the first cron; 5:23 AM Central in standard time, 6:23 in daylight time) and a
#             dispatch that is neither of the others: the full read, every step below.
#   game-day  `tonight` dispatches from the game-day clock (and the schedules that rarely fire): only the unscored
#             bracket games of tonight and the 3 game nights before it (ADRs 0015, 0019, 0030); the late finals and the
#             league bracket details are left out, and a schedule tick also leaves out the ratings model checks.
#   details   Monday to Thursday mornings (the second cron, or the game-day clock's morning tick; a dispatch with `details`):
#             the playoff-week read of kickoffs, sites and league bracket details ONLY, so a playoff week's schedule is
#             current every day with no hand run. `due` counts the playoff games still to play (the brackets' unplayed
#             rounds, tools/league-watch/bracket-due.mjs --playoff-week) and the read is skipped at 0. No MaxPreps read.
name: Results watch
run-name: "${{ ((github.event_name == 'workflow_dispatch' && inputs.details) || (github.event_name == 'schedule' && github.event.schedule == '23 11 * 11-12 1-4')) && 'Results watch: details read' || ((github.event_name == 'workflow_dispatch' && inputs.tonight) || (github.event_name == 'schedule' && github.event.schedule != '23 11 * 8-12,1 5,6,0')) && 'Results watch: game-day read' || 'Results watch: morning read' }}"

on:
  schedule:
    # Game nights are Thursday to Saturday. Read Friday, Saturday and Sunday mornings (11:23 UTC: 5:23 AM Central in
    # standard time, 6:23 in daylight time), August to January. Playoffs run into December; January catches late corrections.
    - cron: "23 11 * 8-12,1 5,6,0"
    # Playoff-week details read (kickoffs and sites only): Monday to Thursday mornings, November and December. The game-day
    # clock starts the same read at 13:00 to 14:59 UTC when this schedule does not fire (gameday-clock.mjs).
    - cron: "23 11 * 11-12 1-4"
    # Playoff game days (ADR 0015, widened by ADR 0019): every 10 minutes, noon to midnight Central (CST, UTC-6: 18:00
    # to 06:00 UTC), every day of November and December. The `due` job lets a run read only when a bracket game of
    # that game night has no score yet, so days without games cost one short check. A run reads only those games, one
    # page each; the Central game night comes from maxpreps.mjs (gameNight), never the UTC date.
    - cron: "*/10 18-23 * 11-12 *"
    - cron: "*/10 0-5 * 11-12 *"
    - cron: "0 6 * 11-12 *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank: the one under way)"
        required: false
      tonight:
        description: "Game-day read: only the unscored bracket games of today and the 3 game nights before (ADRs 0015, 0019, 0030)"
        type: boolean
        default: false
      details:
        description: "Playoff-week details read: kickoffs, sites and league bracket details only (skipped when no playoff game is left to play)"
        type: boolean
        default: false
      write:
        description: "Push the results to both repos before the repo is live (a proof run; no alerts, no database)"
        type: boolean
        default: false
      reread:
        description: "Read a season stored and marked complete again (ADR 0031); with season, e.g. 2019"
        type: boolean
        default: false
      full:
        description: "A full read of every team page, not only what the store is missing (ADR 0031; Mondays are full anyway)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: results-watch

jobs:
  # The kind of read (`mode`: morning, game-day or details; see the header) and, for the last two, whether anything is due.
  # A game-day run goes on only when a bracket game of today's game night, or of one of the 3 game nights before it (ADR
  # 0030: a final posted after a night's last read), has no score yet (ADR 0019). Read from this repo's published
  # playoffs.csv, which carries every bracket row and score. A details run goes on only while a playoff game is still to play.
  due:
    # Always runs, so `maxpreps` never depends on a skipped job: a skipped `due` skipped every morning read and dispatch
    # (Nov 13, 2026). Only a game-day or details tick counts what is due; a morning read answers "run". A dispatch with
    # `tonight` is a game-day tick and one with `details` a details tick: GitHub's schedules fire only now and then in this
    # repo (Nov 2026), so an outside timer dispatches the game-day reads, and each must cost one short check when nothing
    # is due.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.due.outputs.count }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Which read this is
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TONIGHT: ${{ inputs.tonight }}
          DETAILS: ${{ inputs.details }}
        run: |
          # Inputs go through the environment, never into the script's text. `details` wins over `tonight`.
          if [ "$EVENT" = schedule ]; then
            case "$SCHEDULE" in
              "23 11 * 8-12,1 5,6,0") mode=morning ;;
              "23 11 * 11-12 1-4") mode=details ;;
              *) mode=game-day ;;
            esac
          elif [ "$DETAILS" = true ]; then
            mode=details
          elif [ "$TONIGHT" = true ]; then
            mode=game-day
          else
            mode=morning
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Games still to play, or of tonight and the last 3 game nights without a score
        id: due
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = morning ]; then
            echo "count=run" >> "$GITHUB_OUTPUT"
            echo "A morning read: it runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          season=$(( $(date -u +%-m) >= 7 ? $(date -u +%Y) : $(date -u +%Y) - 1 ))
          # A failed check reads anyway rather than miss a final.
          if [ "$MODE" = details ]; then
            # The playoff-week rule: unscored playoff games still to play plus the next-round pairings the brackets set by
            # winners, never a list of dates (bracket-due.mjs playoffWeekCount). 0: no playoff game left, the read is skipped.
            count=$(node tools/league-watch/bracket-due.mjs --playoff-week data/seed "$season") || count=run
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "Playoff games still to play (the details read runs only above 0): $count" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(node tools/league-watch/maxpreps.mjs --due "data/seed/maxpreps-$season/playoffs.csv") || count=run
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Bracket games of tonight and the last 3 game nights without a score: $count" >> "$GITHUB_STEP_SUMMARY"

  maxpreps:
    needs: due
    # `due` says "run" for morning reads and a failed count; only a game-day or details tick with nothing due skips.
    if: ${{ (github.event_name != 'schedule' || vars.LIVE == 'true') && needs.due.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATE_DATA: ${{ github.workspace }}/private
    outputs:
      # The results commit this run pushed (blank when nothing was new), and its season, for the alerts job.
      sha: ${{ steps.commit.outputs.sha }}
      year: ${{ steps.season.outputs.year }}
      # Problems the second-source steps named without failing (ADR 0028), for the notify job.
      ops_reasons: ${{ steps.reasons.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - name: The private data repo, where the reader reads and writes its captures
        uses: actions/checkout@v7
        with:
          repository: txsixman/data-private
          token: ${{ secrets.DATA_PRIVATE_TOKEN }}
          path: private
          # The token is not left in private/.git/config while npm ci and uv run; the commit step passes it to git itself.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/ratings/uv.lock
      - name: Season
        id: season
        env:
          SEASON: ${{ inputs.season }} # an input goes through the environment, never into the script's text
        run: |
          season="$SEASON"
          [ -n "$season" ] || season=$(( $(date -u +%-m) >= 7 ? $(date -u +%Y) : $(date -u +%Y) - 1 ))
          [[ "$season" =~ ^20[0-9][0-9]$ ]] || { echo "season must be a year like 2026, not: $season"; exit 1; }
          echo "year=$season" >> "$GITHUB_OUTPUT"
      - name: Reader checks
        run: node --test tools/league-watch/maxpreps.test.mjs tools/league-watch/store.test.mjs tools/league-watch/davecampbells.test.mjs tools/league-watch/late-finals.test.mjs tools/league-watch/bracket-due.test.mjs tools/league-watch/playoff-week.test.mjs
      - name: Read MaxPreps schedule pages
        # Not on a details read: it reads no MaxPreps page.
        if: ${{ needs.due.outputs.mode != 'details' }}
        env:
          # A game-day read is a playoff-night run (see `mode` in the due job).
          TONIGHT: ${{ needs.due.outputs.mode == 'game-day' && 'true' || 'false' }}
          # A season stored and marked complete is read again only on this input (ADR 0031).
          REREAD: ${{ inputs.reread == true && 'true' || 'false' }}
          FULL: ${{ inputs.full == true && 'true' || 'false' }}
        run: |
          # A night read also writes the games under way (live scores, ADR 0021) to a file outside the repo and the
          # private captures; the next step sends it to the database. A live score never commits and never rebuilds the site.
          if [ "$TONIGHT" = true ]; then
            node tools/league-watch/maxpreps.mjs --season ${{ steps.season.outputs.year }} --tonight --live-out "$RUNNER_TEMP/live.json"
          elif [ "$REREAD" = true ]; then
            node tools/league-watch/maxpreps.mjs --season ${{ steps.season.outputs.year }} --reread
          elif [ "$FULL" = true ]; then
            node tools/league-watch/maxpreps.mjs --season ${{ steps.season.outputs.year }} --full
          else
            node tools/league-watch/maxpreps.mjs --season ${{ steps.season.outputs.year }}
          fi
      - name: Second live source
        # ADR 0025: on a night read, the games under way from a second feed, merged into the same live file (one row a
        # game, the newer read). Off until the repo variable SECOND_LIVE is "true". A failure here (a 403 or 429 stops it
        # at once) leaves the first source's rows as they were.
        if: ${{ vars.SECOND_LIVE == 'true' && needs.due.outputs.mode != 'details' }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
          OPS_REASONS: ${{ runner.temp }}/ops-reasons.txt
        run: |
          if [ -f "$RUNNER_TEMP/live.json" ]; then
            node tools/league-watch/davecampbells.mjs --live "data/seed/maxpreps-$SEASON/playoffs.csv" --merge "$RUNNER_TEMP/live.json"
          fi
      - name: Finals cross-check
        # ADR 0026: the bracket finals MaxPreps has scored in the last three game nights, compared with the same feed's
        # finals, into the private repo's davecampbells-<season>/ (committed below with the captures, never to this
        # repo). The summary shows counts only. Off until the repo variable SECOND_FINALS is "true". A failure (a 403 or
        # 429 stops it at once) writes nothing and changes nothing else.
        if: ${{ vars.SECOND_FINALS == 'true' && needs.due.outputs.mode != 'details' }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
          OPS_REASONS: ${{ runner.temp }}/ops-reasons.txt
        run: node tools/league-watch/davecampbells.mjs --finals "private/maxpreps-$SEASON/playoffs.csv" --report "private/davecampbells-$SEASON"
      - name: Margin check
        # ADR 0059: from the finals cross-check and the season's history check (both private), the finals where the two
        # sources name the same winner but their margins are 7 or more points apart, into the private repo's
        # davecampbells-<season>/margin-check.csv (committed below, never to this repo). No feed is read. The summary
        # shows counts only. It changes no score and no rating.
        if: ${{ vars.SECOND_FINALS == 'true' && needs.due.outputs.mode != 'details' }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
        run: node tools/league-watch/margins.mjs "$SEASON" --private private | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kickoffs and sites
        # ADRs 0036, 0041, 0065 and 0067: on the morning read, the playoff-week details read and a dispatch, each bracket game still to play, each played one
        # of the last two weeks still missing a kickoff or site, and each next-round pairing the bracket sets by winners
        # before any listing has it, gets the second feed's kickoff and site, into a file outside the repo; the commit step merges it into the newest main's
        # data/seed/game-details/<season>.csv, never overwriting a filled value. The log and summary give counts only, by
        # league, never a school. Off until the repo variable SECOND_LIVE is "true" (the same feed's upcoming games). A
        # failure (a 403 or 429 stops it at once) leaves the file as it was. Not on a game-day schedule (a dispatch runs it).
        if: ${{ vars.SECOND_LIVE == 'true' && (github.event_name != 'schedule' || needs.due.outputs.mode != 'game-day') }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
          OPS_REASONS: ${{ runner.temp }}/ops-reasons.txt
        run: |
          f="data/seed/game-details/$SEASON.csv"
          out="$RUNNER_TEMP/game-details.csv"
          if [ -f "$f" ]; then cp "$f" "$out"; fi
          node tools/league-watch/davecampbells.mjs --kickoffs "data/seed/maxpreps-$SEASON/playoffs.csv" --out "$out" > "$RUNNER_TEMP/kickoffs.log"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/kickoffs.log"
      - name: Regular-season sites
        # ADR 0065: on the same runs, each regular-season game of the last 3 days with no site yet gets the second feed's
        # venue, name and city only, unless it is the home team's own field (data/seed/schools/home-fields.csv already names
        # it), into the same file; the commit step merges it, never overwriting a filled value. One mapped team a game, at
        # most 15 minutes; a failure (a 403 or 429 stops it at once) leaves the file as it was. Counts only. Not on a
        # details read: that read is the kickoffs and league bracket details only.
        if: ${{ vars.SECOND_LIVE == 'true' && needs.due.outputs.mode != 'details' && (github.event_name != 'schedule' || needs.due.outputs.mode != 'game-day') }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
        run: |
          f="data/seed/game-details/$SEASON.csv"
          out="$RUNNER_TEMP/game-details.csv"
          if [ ! -f "$out" ] && [ -f "$f" ]; then cp "$f" "$out"; fi
          timeout 900 node tools/league-watch/davecampbells.mjs --venue-details "$SEASON" --out "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Late finals and missing finals
        # ADR 0046: on the morning read and a dispatch that is not a game-day read, a bracket game of a past night that
        # MaxPreps has still not scored takes its final from the league's own bracket (TAIAO, read as a visitor's browser
        # does) or the second source (with SECOND_FINALS): an agreeing pair if both have one, never a forfeit, through the
        # store's merge, so the commit below carries it and a later MaxPreps read can only propose a change (ADR 0031).
        # Any still blank are named in the summary and raise "missing-finals" for the notify job; this step then shows red
        # without stopping the run. A failed source read is counted and never stops the check.
        if: ${{ needs.due.outputs.mode == 'morning' }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
          OPS_REASONS: ${{ runner.temp }}/ops-reasons.txt
          SECOND: ${{ vars.SECOND_FINALS == 'true' && '--second' || '' }}
        run: |
          npm ci --prefix tools/league-watch
          # Three tries of 4 minutes, as the TAIAO reader's job does; with no browser the league bracket is counted unread.
          for _ in 1 2 3; do timeout 240 npx --prefix tools/league-watch playwright install --with-deps chromium && break; sleep 20; done
          node tools/league-watch/late-finals.mjs "private/maxpreps-$SEASON" --season "$SEASON" ${SECOND:+"$SECOND"} --missing "$RUNNER_TEMP/missing-finals.txt"
          [ ! -s "$RUNNER_TEMP/missing-finals.txt" ]
      - name: League bracket kickoffs and sites
        # ADRs 0063 and 0065: on the morning read, the details read and a dispatch that is not a game-day read, each TAIAO bracket game, played or still to play, gets the kickoff and site its league's own
        # bracket shows (read as a visitor's browser does, ADR 0005), name and city only, into the same file outside the
        # repo as the step above; the commit step merges it into the newest main's game details, never overwriting a filled
        # value (ADR 0041). The log and summary give counts only. A failure leaves the file as it was.
        if: ${{ needs.due.outputs.mode == 'morning' || needs.due.outputs.mode == 'details' }}
        continue-on-error: true
        env:
          SEASON: ${{ steps.season.outputs.year }}
        run: |
          f="data/seed/game-details/$SEASON.csv"
          out="$RUNNER_TEMP/game-details.csv"
          if [ ! -f "$out" ] && [ -f "$f" ]; then cp "$f" "$out"; fi
          [ -d tools/league-watch/node_modules ] || npm ci --prefix tools/league-watch
          for _ in 1 2 3; do timeout 240 npx --prefix tools/league-watch playwright install --with-deps chromium && break; sleep 20; done
          node tools/league-watch/taiao.mjs --details --out "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Live scores to the hosted database
        # Before rating and committing, so a score reaches the site in seconds. A failure here is reported and never
        # stops the finals from being committed below: "Problems to post" names it on the robot-alert issue.
        id: live_db
        if: ${{ vars.LIVE == 'true' && needs.due.outputs.mode != 'details' }}
        continue-on-error: true
        env:
          PGHOST: aws-0-us-east-1.pooler.supabase.com
          PGUSER: postgres.vhgnaihnyjdnaaergtcl
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLROOTCERT: packages/db/supabase-ca.crt
        run: |
          if [ ! -f "$RUNNER_TEMP/live.json" ]; then
            echo "Live scores: not a night read, nothing to send." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$PGPASSWORD" ]; then
            echo "Live scores: the SUPABASE_DB_PASSWORD secret is not set, so nothing was sent." >> "$GITHUB_STEP_SUMMARY"
          else
            npm ci --omit=dev --prefix packages/db
            result=$(node packages/db/live.mjs "$RUNNER_TEMP/live.json")
            echo "Live scores sent: $result" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The ratings model's own tests use only its sample games, and CI ran them on the main this checks out. A game-day
      # tick (every 10 minutes) skips them so a new score publishes sooner; the morning read and a dispatch still run them,
      # a details read does not (it reads no score).
      - name: Ratings model checks
        if: ${{ needs.due.outputs.mode != 'details' && (github.event_name != 'schedule' || needs.due.outputs.mode != 'game-day') }}
        run: uv run --directory services/ratings pytest -q
      - name: Commit, the private repo first, then this one
        id: commit
        env:
          WRITE: ${{ (vars.LIVE == 'true' || inputs.write == true) && 'true' || 'false' }}
          # Cross-file checks report here instead of blocking (scripts/check-data.mjs reportIntegrity): one bad source row
          # must not hold back every final on a Friday night. The last step fails the job from this file, after the push.
          INTEGRITY: report
          INTEGRITY_REPORT: ${{ runner.temp }}/integrity-failures.txt
          YEAR: ${{ steps.season.outputs.year }}
          # Used only by the script's git calls on private/ (fetch, push), never written to disk.
          DATA_PRIVATE_TOKEN: ${{ secrets.DATA_PRIVATE_TOKEN }}
          # The kickoffs and sites read above, when that step ran (ADR 0041).
          DETAILS: ${{ runner.temp }}/game-details.csv
        # .github/scripts/commit-results.sh: the private repo first, then this one, each on its newest main, with retries;
        # publish, rerate, the data checks (Zod blocks, cross-file reports) and the summary lines. Tested against local
        # bare repos (commit-results.test.mjs). A details read has no new captures: it republishes from the private store
        # (a repair for an earlier failed push, never a change) and merges the kickoffs and sites it read.
        run: .github/scripts/commit-results.sh "$YEAR"
      # ADR 0031: the season's games go to the hosted database in the same run, from the private store just committed (the
      # same upsert as the full load: a game whose stored row says the same thing is left alone, and none is deleted). The
      # full load (supabase.yml) still runs on Mondays for alignments, lineage and migrations. A failure here is reported and
      # never undoes the commit.
      - name: Games to the hosted database
        id: games_db
        if: ${{ vars.LIVE == 'true' && steps.commit.outcome == 'success' && needs.due.outputs.mode != 'details' }}
        continue-on-error: true
        env:
          PGHOST: aws-0-us-east-1.pooler.supabase.com
          PGUSER: postgres.vhgnaihnyjdnaaergtcl
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLROOTCERT: packages/db/supabase-ca.crt
          YEAR: ${{ steps.season.outputs.year }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "Games to the database: the SUPABASE_DB_PASSWORD secret is not set, so nothing was sent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm ci --omit=dev --prefix packages/db
          result=$(node packages/db/load.mjs --games "$YEAR")
          echo "Games to the database: $result" >> "$GITHUB_STEP_SUMMARY"
      - name: Kickoff alerts
        id: kickoff_alerts
        # ADR 0082: a game that first shows in the live file gets one push alert to the browsers following either team (once,
        # by the sent-log, so every 10-minute run can offer it). Last before the cross-file
        # check, so it never delays the finals' commit. Dark: tools/push/send-finals.mjs does nothing until the
        # push_alerts switch is on. It must never hold back the finals, so a failure is reported and goes no further.
        if: ${{ !cancelled() && vars.LIVE == 'true' && needs.due.outputs.mode != 'details' }}
        continue-on-error: true
        env:
          PGHOST: aws-0-us-east-1.pooler.supabase.com
          PGUSER: postgres.vhgnaihnyjdnaaergtcl
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLROOTCERT: packages/db/supabase-ca.crt
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SEASON: ${{ steps.season.outputs.year }}
        run: |
          set -o pipefail
          if [ ! -f "$RUNNER_TEMP/live.json" ]; then
            echo "Kickoff alerts: not a night read, nothing to send." >> "$GITHUB_STEP_SUMMARY"
          else
            npm ci --prefix tools/push
            result=$(node tools/push/send-finals.mjs --season "$SEASON" --live "$RUNNER_TEMP/live.json" | tail -n 1)
            echo "Kickoff alerts: $result" >> "$GITHUB_STEP_SUMMARY"
          fi
      # After the push: a cross-file failure the commit step reported (not blocking) fails the job, so the owner is emailed.
      # The jobs below run on the pushed commit all the same (their `if` reads the sha, not this job's result).
      - name: Cross-file data checks (reported above, after the push)
        run: |
          f="$RUNNER_TEMP/integrity-failures.txt"
          [ -s "$f" ] || exit 0
          echo "Cross-file data checks failed; the results were pushed anyway (scripts/check-data.mjs, INTEGRITY=report):"
          cat "$f"
          exit 1
      # Whatever happened above: the problems the second-source steps named (a refusal, no season id, no agreeing
      # final), one word each, for the notify job to post (ADR 0028), and each game-night step that may fail without
      # failing the run (continue-on-error) and did: without this its failure showed only inside the run, and no one looks.
      - name: Problems to post
        id: reasons
        if: always()
        env:
          LIVE_DB: ${{ steps.live_db.outcome }}
          GAMES_DB: ${{ steps.games_db.outcome }}
          KICKOFF_ALERTS: ${{ steps.kickoff_alerts.outcome }}
        run: |
          f="$RUNNER_TEMP/ops-reasons.txt"
          [ "$LIVE_DB" != failure ] || echo live-scores-failed >> "$f"
          [ "$GAMES_DB" != failure ] || echo games-db-failed >> "$f"
          [ "$KICKOFF_ALERTS" != failure ] || echo kickoff-alerts-failed >> "$f"
          [ -s "$f" ] || exit 0
          echo "list=$(sort -u "$f" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  # Push alerts (tools/push/send-finals.mjs, web-push) to everyone following a program with a new final in the commit
  # just pushed. When the push_alerts switch is on (migration 0031, ADR 0082) it also sends the next-round pairings the
  # brackets have set and nobody has played, and words the final with its game page; the kickoff alerts go from the maxpreps job.
  # Without the VAPID_PRIVATE_KEY or SUPABASE_DB_PASSWORD secret it says so and sends nothing.
  alerts:
    needs: maxpreps
    if: ${{ !cancelled() && needs.maxpreps.outputs.sha != '' && vars.LIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: aws-0-us-east-1.pooler.supabase.com
      PGUSER: postgres.vhgnaihnyjdnaaergtcl
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.maxpreps.outputs.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix tools/push
      - name: Send alerts for the new finals
        run: node tools/push/send-finals.mjs --season ${{ needs.maxpreps.outputs.year }} --before HEAD~1

  # After a morning or details read: the playoff games of the next 72 hours that still have no kickoff or no site, each
  # named on the robot-alert issue (.github/scripts/playoff-details.mjs; the same games at most once every 12 hours).
  # Read from the newest main, so the kickoffs and sites just committed count. A warning: it never fails the run. The
  # hourly Site freshness check runs the same script.
  playoff-details:
    needs: [due, maxpreps]
    if: ${{ !cancelled() && vars.LIVE == 'true' && needs.maxpreps.result != 'skipped' && (needs.due.outputs.mode == 'morning' || needs.due.outputs.mode == 'details') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            .github/scripts
            tools/league-watch
            apps/web/lib
            data/seed
            data/corrections
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Playoff games with no kickoff or no site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/playoff-details.mjs --alert

  # Did the new scores reach the live site? Report only: waits up to 5 minutes for production's /build.json to show the
  # commit just pushed and says "Deployed" or "Not yet" in the run summary; it never fails the run. The hourly Site
  # freshness check (site-freshness.yml) is the one that fails and emails when a deploy stays missing.
  # Not on a game-day read: this wait (up to 5 minutes, every new score) kept the run, and so the next read behind
  # `concurrency`, waiting, and the hourly check covers it.
  deployed:
    needs: [due, maxpreps]
    if: ${{ !cancelled() && needs.maxpreps.outputs.sha != '' && vars.LIVE == 'true' && needs.due.outputs.mode != 'game-day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Production has the new results (deployed or not yet)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/site-freshness.mjs --expect "${{ needs.maxpreps.outputs.sha }}" --wait 300 | tee -a "$GITHUB_STEP_SUMMARY"

  # New scores go into the hosted database too, once they are committed (supabase.yml does nothing before LIVE).
  supabase:
    needs: maxpreps
    # Also after a cross-file failure, which fails the maxpreps job only after its push.
    if: ${{ !cancelled() && (needs.maxpreps.result == 'success' || needs.maxpreps.outputs.sha != '') }}
    uses: ./.github/workflows/supabase.yml
    secrets: inherit

  # A failed or cancelled job (a timeout counts) is posted to the one open robot-alert issue (ADR 0027), and so is each
  # problem the second-source steps named without failing (ADR 0028). `deployed` is report-only and left out. The
  # cross-file check that fails `maxpreps` after its push lands here too.
  notify:
    needs: [due, maxpreps, alerts, supabase]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.maxpreps.outputs.ops_reasons != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Post the failure to the robot-alert issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REASONS: ${{ needs.maxpreps.outputs.ops_reasons }}
        run: |
          node .github/scripts/ops-alert.mjs
          for reason in $REASONS; do
            # Our own fixed words only; ops-alert.mjs refuses any reason it does not know.
            if [[ "$reason" =~ ^[a-z-]+$ ]]; then node .github/scripts/ops-alert.mjs --reason "$reason"; fi
          done
