# Reads six-man game results from MaxPreps team schedule pages (ADR 0008; playoff game days, ADRs 0015 and 0019), rerates the
# season, and commits straight to main, so Vercel deploys new scores and ratings with no one at a keyboard. The full
# captures (each game's source page, coverage, outside games) live in the private repo txsixman/data-private; this repo
# gets the facts the site shows (tools/league-watch/publish.mjs). The private repo is committed first, then this one,
# and every run republishes from the private files, so a run whose public push failed is repaired by the next. A commit
# made with the workflow's token does not start CI, so this job runs the same checks first. A failed read fails the job
# and GitHub emails the repo owner.
# Before cut-over (repo variable LIVE not true) the schedules do nothing, a dispatch reads and checks but pushes only
# with the input `write`, and alerts and the hosted database are never touched.
name: Results watch

on:
  schedule:
    # Game nights are Thursday to Saturday. Read Friday, Saturday and Sunday mornings (6:23 AM Central), August to
    # January. Playoffs run into December; January catches late corrections.
    - cron: "23 11 * 8-12,1 5,6,0"
    # Playoff game days (ADR 0015, widened by ADR 0019): every 10 minutes, noon to midnight Central (CST, UTC-6: 18:00
    # to 06:00 UTC), every day of November and December. The `due` job lets a run read only when a bracket game of
    # that game night has no score yet, so days without games cost one short check. A run reads only those games, one
    # page each; the Central game night comes from maxpreps.mjs (gameNight), never the UTC date.
    - cron: "*/10 18-23 * 11,12 *"
    - cron: "*/10 0-5 * 11,12 *"
    - cron: "0 6 * 11,12 *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank: the one under way)"
        required: false
      tonight:
        description: "Game-day read: only today's unscored bracket games (ADRs 0015, 0019)"
        type: boolean
        default: false
      write:
        description: "Push the results to both repos before the repo is live (a proof run; no alerts, no database)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: results-watch

jobs:
  # A game-day run (any schedule but the morning one) goes on only when a bracket game of today's game night has no
  # score yet (ADR 0019). Read from this repo's published playoffs.csv, which carries every bracket row and score.
  due:
    if: github.event_name == 'schedule' && github.event.schedule != '23 11 * 8-12,1 5,6,0' && vars.LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.due.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bracket games of tonight without a score
        id: due
        run: |
          season=$(( $(date -u +%-m) >= 7 ? $(date -u +%Y) : $(date -u +%Y) - 1 ))
          count=$(node tools/league-watch/maxpreps.mjs --due "data/seed/maxpreps-$season/playoffs.csv")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Bracket games of tonight without a score: $count" >> "$GITHUB_STEP_SUMMARY"

  maxpreps:
    needs: due
    # Morning reads and dispatches skip `due` and always run; a failed check reads anyway rather than miss a final.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || vars.LIVE == 'true') && needs.due.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATE_DATA: ${{ github.workspace }}/private
    outputs:
      # The results commit this run pushed (blank when nothing was new), and its season, for the alerts job.
      sha: ${{ steps.commit.outputs.sha }}
      year: ${{ steps.season.outputs.year }}
    steps:
      - uses: actions/checkout@v7
      - name: The private data repo, where the reader reads and writes its captures
        uses: actions/checkout@v7
        with:
          repository: txsixman/data-private
          token: ${{ secrets.DATA_PRIVATE_TOKEN }}
          path: private
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/ratings/uv.lock
      - name: Season
        id: season
        run: |
          season="${{ inputs.season }}"
          [ -n "$season" ] || season=$(( $(date -u +%-m) >= 7 ? $(date -u +%Y) : $(date -u +%Y) - 1 ))
          echo "year=$season" >> "$GITHUB_OUTPUT"
      - name: Reader checks
        run: node --test tools/league-watch/maxpreps.test.mjs
      - name: Read MaxPreps schedule pages
        # Any schedule but the morning one is a playoff-night run.
        run: node tools/league-watch/maxpreps.mjs --season ${{ steps.season.outputs.year }} ${{ (inputs.tonight || (github.event_name == 'schedule' && github.event.schedule != '23 11 * 8-12,1 5,6,0')) && '--tonight' || '' }}
      # The ratings model's own tests use only its sample games, and CI ran them on the main this checks out. A game-day
      # tick (every 10 minutes) skips them so a new score publishes sooner; the morning read and a dispatch still run them.
      - name: Ratings model checks
        if: github.event_name != 'schedule' || github.event.schedule == '23 11 * 8-12,1 5,6,0'
        run: uv run --directory services/ratings pytest -q
      - name: Commit, the private repo first, then this one
        id: commit
        env:
          WRITE: ${{ (vars.LIVE == 'true' || inputs.write == true) && 'true' || 'false' }}
        run: |
          year=${{ steps.season.outputs.year }}
          dir="maxpreps-$year"
          cp -r "private/$dir" "$RUNNER_TEMP/read"
          for repo in private .; do
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done
          message="Results and ratings from MaxPreps, $(date -u +%Y-%m-%d)"
          # 1. The private repo: this read's captures laid on its newest main. Only this workflow writes them.
          for try in 1 2 3 4; do
            [ "$try" -le 3 ] || exit 1
            git -C private fetch -q origin main
            git -C private reset -q --hard origin/main
            rm -rf "private/$dir" && cp -r "$RUNNER_TEMP/read" "private/$dir"
            if [ -z "$(git -C private status --porcelain -- "$dir")" ]; then
              echo "Private repo: no new captures." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$WRITE" != true ]; then
              echo "Private repo: new captures, not pushed (not live, no \`write\` input)." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            git -C private add "$dir"
            git -C private commit -q -m "$message"
            git -C private push -q origin HEAD:main && break
            echo "data-private main moved; try $try again"
          done
          # 2. This repo: the facts published from the private files and rerated, on the newest main. It runs even when
          # the private repo had nothing new, so a run whose public push failed is repaired here, with nothing lost.
          # Another commit (CI's ratings table, a hand capture) may land meanwhile, so up to three tries.
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node tools/league-watch/publish.mjs "private/$dir" "data/seed/$dir"
            uv run --directory services/ratings python run.py --season "$year"
            if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
              echo "No new results." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Zod checks on every file the site reads: a bad row fails the run here and never reaches main. The checks'
            # packages install only when there is something new to check (most game-day ticks have nothing).
            [ -d apps/web/node_modules ] || npm ci --prefix apps/web --no-audit --no-fund
            node apps/web/scripts/check-data.mjs
            if [ "$WRITE" != true ]; then
              { echo "New results, not pushed (not live, no \`write\` input):"; git diff --stat -- data; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git add "data/seed/$dir" data/ratings
            git commit -q -m "$message"
            if git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              head -3 "private/$dir/coverage.txt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main moved; try $try again"
          done
          exit 1

  # Push alerts (tools/push/send-finals.mjs, web-push) to everyone following a program with a new final in the commit
  # just pushed. Without the VAPID_PRIVATE_KEY or SUPABASE_DB_PASSWORD secret it says so and sends nothing.
  alerts:
    needs: maxpreps
    if: needs.maxpreps.outputs.sha != '' && vars.LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: aws-0-us-east-1.pooler.supabase.com
      PGUSER: postgres.vhgnaihnyjdnaaergtcl
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.maxpreps.outputs.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix tools/push
      - name: Send alerts for the new finals
        run: node tools/push/send-finals.mjs --season ${{ needs.maxpreps.outputs.year }} --before HEAD~1

  # New scores go into the hosted database too, once they are committed (supabase.yml does nothing before LIVE).
  supabase:
    needs: maxpreps
    uses: ./.github/workflows/supabase.yml
    secrets: inherit
